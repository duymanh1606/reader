services:
  reader:
    build: .
    image: reader:latest
    container_name: reader
    restart: unless-stopped
    ports:
      - "${READER_PORT:-5678}:5678"
    env_file:
      - path: .env
        required: false
    environment:
      - READER_HOST=0.0.0.0
      - READER_PORT=5678
      - READER_HEADLESS=true
      - READER_BROWSER_CHANNEL=
    volumes:
      # Giữ lại phiên đăng nhập Outlook (cookies, session) giữa các lần chạy
      - ./.profiles:/app/.profiles
    # Tăng /dev/shm để Chromium không bị crash khi render trang Outlook
    shm_size: "1gb"

