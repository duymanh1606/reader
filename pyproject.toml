[project]
name = "reader"
version = "0.1.0"
description = "Dán email Outlook, agent tự đăng nhập và trả về mã OTP gần nhất."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "playwright>=1.44",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
